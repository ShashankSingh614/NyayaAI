[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-voice-ai-models"
version = "1.0.0"
description = "AI Models for Legal Voice Nexus - Legal document processing and analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Legal Voice Team"}
]
keywords = ["legal", "ai", "document-processing", "ocr", "nlp"]

dependencies = [
    "groq==0.11.0",
    "httpx==0.27.0",
    "flask==3.0.0",
    "python-dotenv==1.0.0",
    "sentence-transformers==3.4.1",
    "scikit-learn==1.6.1",
    "numpy==2.1.2",
    "pandas==2.2.3",
    "tqdm==4.67.0",
    "pillow==11.0.0",
    "pdfplumber==0.11.0",
    "PyPDF2==3.0.1",
    "pymupdf==1.24.10",
    "pytesseract==0.3.10",
    "requests==2.32.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "deep-translator==1.11.4",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "black==23.12.0",
    "flake8==6.1.0",
    "pytest==7.4.3",
]
